name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test, lint, vulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Go and golangci-lint from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: golangci-lint
        run: golangci-lint run
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Web (check, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install node from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: node
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (Playwright, generated media)
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Go and node from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go node
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build bin/retake
        run: make build
      - name: Type-check the suite
        working-directory: e2e
        run: npm run typecheck
      - name: Run the suite against bin/retake
        working-directory: e2e
        env:
          RETAKE_SERVER: new
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROMIUM_PATH
          echo "Chromium: $CHROMIUM_PATH"
          npm test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - name: Upload the takes and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-takes
          # .retake-work is a hidden folder: upload-artifact skips those unless told otherwise.
          include-hidden-files: true
          path: |
            .retake-work/e2e/**/*.review/
            .retake-work/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

  editor:
    name: Editor (Rust fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Install ffmpeg (the engine runs it as a subprocess; the tests generate their media with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  notices:
    name: THIRD_PARTY_NOTICES.md is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Go, node and Rust from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go node rust
      - name: Fetch what the notices list (Go modules, the page's packages, crates)
        run: |
          go mod download
          npm --prefix web ci
          cargo fetch --locked --manifest-path editor/Cargo.toml
      - name: scripts/notices.mjs --check
        run: node scripts/notices.mjs --check

  quickstart:
    name: Quickstart (docs/quickstart.md on the sample project)
    needs: [go, web, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Go, node and Rust from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go node rust
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
      - name: Build bin/retake and retake-edit
        run: |
          make build
          cargo build --release --locked -p retake-edit --manifest-path editor/Cargo.toml
      - name: Install Playwright's Chromium (for the C check)
        run: |
          npm --prefix e2e ci
          cd e2e && npx playwright install --with-deps chromium
      - name: Run the quickstart without a person
        run: |
          CHROMIUM_PATH="$(cd e2e && node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROMIUM_PATH
          examples/sample/run-quickstart.sh

  # Tags only: release archives for inspection. Nothing is published (release.disable in .goreleaser.yaml).
  editor-release:
    name: retake-edit ${{ matrix.os }}/${{ matrix.arch }} (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [editor]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { runner: macos-14, os: darwin, arch: amd64, target: x86_64-apple-darwin }
          - { runner: macos-14, os: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { runner: windows-latest, os: windows, arch: amd64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          key: ${{ matrix.target }}
      - name: cargo build --release
        working-directory: editor
        run: cargo build --release --locked -p retake-edit --target ${{ matrix.target }}
      - name: Package (named like goreleaser's archives, which scripts/install.sh expects)
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="retake-edit_${version}_${OS}_${ARCH}"
          mkdir -p dist-editor stage
          cp README.md CHANGELOG.md THIRD_PARTY_NOTICES.md stage/
          if [ "$OS" = windows ]; then
            cp "editor/target/$TARGET/release/retake-edit.exe" stage/
            (cd stage && 7z a -tzip "../dist-editor/$name.zip" .)
          else
            cp "editor/target/$TARGET/release/retake-edit" stage/
            if [ "$OS" = darwin ]; then owner=(--uid 0 --gid 0); else owner=(--owner=0 --group=0); fi
            tar "${owner[@]}" -czf "dist-editor/$name.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-editor/*
          retention-days: 14

  release-snapshot:
    name: Release snapshot (goreleaser, tags only, publishes nothing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, e2e, notices, quickstart, editor-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the tags
      - name: Install Go, node and goreleaser from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go node goreleaser
      - name: The retake-edit archives, for checksums.txt
        uses: actions/download-artifact@v7
        with:
          pattern: editor-*
          path: dist-editor
          merge-multiple: true
      - name: The tools that ship with retake (herdr, ffmpeg, retake-edit), pinned by SHA-256
        run: scripts/bundle-deps.sh
      - name: goreleaser release --snapshot
        run: goreleaser release --snapshot --clean --parallelism 2
      - name: The Mac app (unsigned, universal)
        run: sudo apt-get install -y llvm zip && scripts/macos-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist-editor/*
          retention-days: 14
