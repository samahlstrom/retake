name: Release

# Builds Retake for every platform on native runners, tests each install, and publishes it (docs/releasing.md):
#
#   push a vX.Y.Z tag      every test (ci.yml), the builds, the npm install tested on each platform; once all of that
#                          passed, in this same run with nobody pressing anything: the GitHub release (published,
#                          with the archives, checksums.txt and the install scripts), then the npm packages (trusted
#                          publishing, provenance) and the Homebrew formula.
#   Run workflow, dry_run  (Actions, Release, Run workflow, any branch) the same builds and tests, and the publish
#                          jobs up to the point of publishing; everything is uploaded as this run's artifacts and
#                          nothing is published. dry_run off, from a tag: as a push.
#   push a dry-run/* branch the same dry run, for before this file is on the default branch (GitHub offers Run
#                          workflow only for workflows there): git push origin HEAD:dry-run/<name>
#
# npm and Homebrew don't wait on each other: one failing (npm wanting auth for a package, say) leaves the other and
# the GitHub release out, and says which package and why. "Re-run failed jobs" on the run's page then finishes it;
# every publish step skips what's out already. Other pushes never run this; ci.yml does.

on:
  push:
    tags: ["v*"]
    branches: ["dry-run/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------------------------------------
  # Build and test.

  plan:
    name: What this run does
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="" publish=false
          if [ "$EVENT" = push ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) tag="$GITHUB_REF_NAME" publish=true ;;
              *) ;; # a dry-run/* branch
            esac
          elif [ "$DRY_RUN" != true ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) tag="$GITHUB_REF_NAME" publish=true ;;
              *) echo "::error::A release runs from a v* tag (choose it under 'Use workflow from'), or turn dry_run on."; exit 1 ;;
            esac
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=${version:-snapshot}"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "Tag: ${tag:-none (a snapshot)}. Publishes the GitHub release, npm and Homebrew: $publish." >>"$GITHUB_STEP_SUMMARY"

  ci:
    name: Tests
    needs: [plan]
    uses: ./.github/workflows/ci.yml

  # retake-edit links prebuilt Skia, so it's built on each system it runs on. Linux on Ubuntu 22.04, so it needs only
  # glibc 2.35 (Debian 12, Ubuntu 22.04 and newer).
  editor:
    name: retake-edit ${{ matrix.os }}/${{ matrix.arch }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 } # GitHub's last Intel Mac image (until fall 2027)
          - { runner: windows-latest, os: windows, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Initialize MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          key: release-${{ matrix.os }}-${{ matrix.arch }}
      - name: Build retake-edit
        if: matrix.os != 'windows'
        run: |
          cargo build --release --locked -p retake-edit --manifest-path editor/Cargo.toml
          mkdir -p stage
          cp editor/target/release/retake-edit stage/
      # Windows: scripts/build-windows.ps1 -OutDir <dir> puts retake-edit.exe (and anything else Windows-only) in <dir>
      # (docs/releasing.md). Until it exists, cargo alone.
      - name: Build retake-edit (scripts/build-windows.ps1)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          if (Test-Path scripts/build-windows.ps1) {
            ./scripts/build-windows.ps1 -OutDir stage
          } else {
            Write-Output "::warning::scripts/build-windows.ps1 isn't in this checkout yet: building retake-edit with cargo"
            cargo build --release --locked -p retake-edit --manifest-path editor/Cargo.toml
            Copy-Item editor/target/release/retake-edit.exe stage/
          }
          if (-not (Test-Path stage/retake-edit.exe)) { throw "no stage/retake-edit.exe" }
      - name: It runs here
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          stage/retake-edit --version
          scripts/install-whisper.sh --cpu --prefix "$PWD/stage/whisper" --jobs 2
          cp stage/whisper/bin/whisper-cli* stage/
          if [ "$OS" = windows ]; then stage/whisper-cli.exe --help; else stage/whisper-cli --help; fi
          if [ "$OS" = darwin ]; then
            minimum="$(xcrun vtool -show-build stage/whisper-cli | awk '$1 == "minos" { print $2 }')"
            echo "Whisper minimum macOS: $minimum (Retake supports 12.0+)"
            # The new Accelerate BLAS symbols require macOS 13.3 even when weak-linked.
            nm -u stage/whisper-cli | awk '/NEWLAPACK/ { bad = 1 } END { exit bad }'
            awk -v minimum="$minimum" 'BEGIN { split(minimum, v, "."); if (!minimum || v[1] > 12 || (v[1] == 12 && v[2] > 0)) exit 1 }'
          fi
          rm -rf stage/whisper
      - name: Package (named like goreleaser's archives; scripts/bundle-deps.sh puts it in the release archive)
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="retake-edit_${VERSION}_${OS}_${ARCH}"
          mkdir -p dist-editor
          cp README.md CHANGELOG.md THIRD_PARTY_NOTICES.md LICENSE stage/
          if [ "$OS" = windows ]; then
            (cd stage && 7z a -tzip "../dist-editor/$name.zip" .)
          else
            if [ "$OS" = darwin ]; then owner=(--uid 0 --gid 0); else owner=(--owner=0 --group=0); fi
            tar "${owner[@]}" -czf "dist-editor/$name.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-editor/*
          retention-days: 14

  # Linux's ffmpeg and ffprobe, built from pinned sources on an x64 and an arm64 runner (scripts/ffmpeg-build/build.sh),
  # cached by the build script, and run there. Uploads ffmpeg-linux-amd64 and ffmpeg-linux-arm64.
  ffmpeg:
    name: ffmpeg
    needs: [plan]
    uses: ./.github/workflows/ffmpeg.yml

  package:
    name: Archives, npm packages, Homebrew formula
    needs: [plan, ci, editor, ffmpeg]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the tags
      - name: Install Go, node and goreleaser from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: go node goreleaser
      - name: The retake-edit builds
        uses: actions/download-artifact@v7
        with:
          pattern: editor-*
          path: dist-editor
          merge-multiple: true
      - name: Linux's ffmpeg and ffprobe, and their source (the ffmpeg job's)
        uses: actions/download-artifact@v7
        with:
          pattern: ffmpeg-linux-*
          path: dist-ffmpeg
          merge-multiple: true
      - name: The tools that ship with Retake (herdr, ffmpeg, retake-edit, whisper-cli), pinned by SHA-256
        env:
          RETAKE_FFMPEG_DIR: dist-ffmpeg
          RETAKE_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/bundle-deps.sh
      - name: Archives and checksums.txt (goreleaser; it publishes nothing)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            goreleaser release --clean --skip=publish,announce --parallelism 2
          else
            goreleaser release --snapshot --clean --parallelism 2
          fi
      - name: The Mac app (unsigned, universal)
        run: sudo apt-get install -y llvm zip && scripts/macos-app.sh
      - name: The npm packages (every platform, each under npm's size limit)
        run: scripts/npm-pack.sh
      - name: The Homebrew formula the publish step will push
        run: |
          version="$(node -p 'require("./dist/metadata.json").version')"
          scripts/brew-formula.sh "$version" dist/checksums.txt >dist/retake.rb
      - name: Sizes
        run: |
          {
            echo '| File | Bytes |'
            echo '|---|---|'
            for f in dist/retake_*.tar.gz dist/*.zip dist/npm/*.tgz dist-bundle/ffmpeg-source-*.tar.xz; do
              echo "| $(basename "$f") | $(wc -c <"$f") |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
      - name: The retake-edit archives and ffmpeg's source next to the rest (checksums.txt lists them too)
        run: cp dist-editor/* dist-bundle/ffmpeg-source-*.tar.xz dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/ffmpeg-source-*.tar.xz
            dist/checksums.txt
            dist/metadata.json
            dist/retake.rb
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: dist/npm/*.tgz
          retention-days: 14
      # Windows has no npm package: its install test serves this to the launcher, standing in for the GitHub release.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-archive
          path: dist/retake_*_windows_amd64.zip
          retention-days: 14

  # The npm install, end to end, on each platform with that platform's own package (scripts/npm-smoke.mjs): npm i -g,
  # the bundled ffmpeg (libx264, zscale), the setup page, Ctrl+C, an agent calling retake with nothing on PATH, npx.
  # Windows has no platform package: its launcher downloads the release archive, here from a stand-in for GitHub
  # Releases. On the Macs also the Homebrew formula, installed from a local tap.
  smoke:
    name: Install on ${{ matrix.name }}
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-22.04, node: "lts/*" }
          - { name: Linux x64 (Node 18), runner: ubuntu-22.04, node: "18" }
          - { name: Linux arm64, runner: ubuntu-22.04-arm, node: "lts/*" }
          - { name: macOS arm64, runner: macos-15, node: "lts/*", brew: true }
          - { name: macOS x64, runner: macos-15-intel, node: "lts/*", brew: true }
          - { name: Windows x64, runner: windows-latest, node: "lts/*", archive: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: npm
          path: dist/npm
      - uses: actions/download-artifact@v7
        if: matrix.archive
        with:
          name: windows-archive
          path: dist
      - name: npm i -g, npx, the bundled tools, an agent (scripts/npm-smoke.mjs)
        shell: bash
        env:
          RETAKE_SMOKE_DIR: ${{ runner.temp }}/npm-smoke
        run: node scripts/npm-smoke.mjs dist/npm
      - uses: actions/download-artifact@v7
        if: matrix.brew
        with:
          name: release
          path: dist
      - name: brew install from a local tap, brew test
        if: matrix.brew
        run: |
          version="$(node -p 'require("./dist/metadata.json").version')"
          scripts/brew-formula.sh "$version" dist/checksums.txt "file://$PWD/dist" >retake.rb
          brew tap-new --no-git local/retake
          cp retake.rb "$(brew --repository local/retake)/Formula/retake.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install local/retake/retake
          brew test local/retake/retake
          retake --version
          brew uninstall retake
          brew untap local/retake

  # ------------------------------------------------------------------------------------------------------------------
  # Publish, once every test and install test passed. In a dry run these run up to the point of publishing.

  release:
    name: GitHub release
    needs: [plan, package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: dist
      - name: gh release create, as a draft until every file is up, then published
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # This version's CHANGELOG section, then how to install it.
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v || $2 == "[" v "]" || $2 == "v" v) ; next }
            on { print }
          ' CHANGELOG.md >notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)." >notes.md
          cat >>notes.md <<EOF

          ## Install

          \`\`\`
          npm i -g retake-cli
          retake
          \`\`\`

          No Node: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\` (macOS, Linux),
          \`irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.ps1 | iex\` (Windows), or
          \`brew install samahlstrom/retake/retake\`.
          EOF
          extra=() latest=(--latest)
          case "$VERSION" in *-*) extra+=(--prerelease) latest=() ;; esac
          files=(dist/*.tar.gz dist/*.zip dist/ffmpeg-source-*.tar.xz dist/checksums.txt install.sh)
          [ ! -f install.ps1 ] || files+=(install.ps1)
          ls -l "${files[@]}"
          if [ "$PUBLISH" != true ]; then
            echo "A dry run: no release. It would be \"Retake $VERSION\" with the ${#files[@]} files above." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A draft first, so the release is never public without its files (install.sh reads the latest release).
          # A re-run finds the draft (or the published release) and carries on.
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$state" in
            none) gh release create "$TAG" --draft --verify-tag --title "Retake $VERSION" --notes-file notes.md "${extra[@]}" "${files[@]}" ;;
            true) gh release upload "$TAG" --clobber "${files[@]}" ;;
            *) echo "$TAG is published already" ;;
          esac
          [ "$state" = false ] || gh release edit "$TAG" --draft=false "${latest[@]}"
          echo "Released: $(gh release view "$TAG" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish to npm
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing: no npm token anywhere
    steps:
      - uses: actions/checkout@v7
      - name: Install node from mise.toml (npm 11.5+ publishes with trusted publishing)
        uses: jdx/mise-action@v5
        with:
          install_args: node
      - name: The npm packages the install tests passed with
        uses: actions/download-artifact@v7
        with:
          name: npm
          path: dist/npm
      - name: Windows' archive, as the launcher will download it from the release, matches its SHA-256
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          name="$(node -p 'require("./npm/retake-cli/package.json").name')"
          mkdir -p cli && tar -xzf "$(ls dist/npm/"$name"-[0-9]*.tgz)" -C cli
          node -e '
            const a = require("./cli/package/package.json").archives || {};
            for (const d of new Map(Object.values(a).map((d) => [d.url, d])).values()) console.log(d.url, d.sha256);
          ' >archives.txt
          cat archives.txt
          [ -s archives.txt ] || { echo "::error::$name's package.json has no archives (Windows)"; exit 1; }
          if [ "$PUBLISH" != true ]; then
            echo "A dry run: no release to download from"
            exit 0
          fi
          while read -r url sum; do
            got="$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$sum" ] || { echo "::error::$url is $got, not $sum: Windows installs would refuse it"; exit 1; }
            echo "$url: ok"
          done <archives.txt
      - name: npm publish (the platform packages, then the command)
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="$(node -p 'require("./npm/retake-cli/package.json").name')"
          v="$(node -p 'require("./cli/package/package.json").version')"
          [ "$PUBLISH" != true ] || [ "$v" = "$VERSION" ] || { echo "::error::the packages are $v, the tag says $VERSION"; exit 1; }
          dist_tag=latest
          case "$v" in *-*) dist_tag=next ;; esac
          failed=""
          publish() { # package file
            if [ "$PUBLISH" != true ]; then
              echo "A dry run: would publish $1@$v ($2) with --tag $dist_tag"
            elif [ "$(npm view "$1@$v" version 2>/dev/null)" = "$v" ]; then
              echo "$1@$v is on npm already"
            elif npm publish "$2" --access public --provenance --tag "$dist_tag" >publish.log 2>&1; then
              cat publish.log
              echo "Published $1@$v" >>"$GITHUB_STEP_SUMMARY"
            else
              cat publish.log
              if grep -qiE 'ENEEDAUTH|need auth|E401|E403|E404|OIDC|trusted publish' publish.log; then
                why="npm wants auth: $1 doesn't trust this workflow. On npmjs.com, $1, Settings, Trusted Publisher, GitHub Actions: samahlstrom/retake, workflow release.yml, no environment (docs/releasing.md)"
              else
                why="npm publish failed: its log is above"
              fi
              echo "::error title=npm publish $1::$why"
              echo "- **$1@$v not published**: $why" >>"$GITHUB_STEP_SUMMARY"
              failed="$failed $1"
            fi
          }
          for f in dist/npm/*.tgz; do
            pkg="$(basename "$f" "-$v.tgz")"
            [ "$pkg" != "$name" ] || continue
            publish "$pkg" "$f"
          done
          if [ -n "$failed" ]; then
            # The command lists every platform package at this version: it waits until they're all out.
            echo "::error title=npm::Not published:$failed. $name@$v waits for them; fix that, then Re-run failed jobs."
            exit 1
          fi
          publish "$name" "dist/npm/$name-$v.tgz"
          [ -z "$failed" ] || exit 1

  homebrew:
    name: Update the Homebrew tap
    needs: [plan, release]
    if: ${{ !contains(needs.plan.outputs.version, '-') || needs.plan.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The formula, from the release's checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$PUBLISH" != true ]; then
            echo "A dry run: no release (the package job made and the Mac install tests used this run's formula)"
            exit 0
          fi
          gh release download "$TAG" --dir dist --pattern checksums.txt
          scripts/brew-formula.sh "${TAG#v}" dist/checksums.txt >retake.rb
      - name: HOMEBREW_TAP_DEPLOY_KEY is set
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Add the HOMEBREW_TAP_DEPLOY_KEY secret (docs/releasing.md, One-time setup)"; exit 1; }
      # A deploy key that can write to the tap repo and nothing else (no personal token needed).
      - uses: actions/checkout@v7
        with:
          repository: samahlstrom/homebrew-retake
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Push Formula/retake.rb
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd tap
          if [ "$PUBLISH" != true ]; then
            git push --dry-run origin HEAD # the key can write (a read-only key is refused here)
            echo "A dry run: the deploy key can push to the tap; nothing pushed"
            exit 0
          fi
          mkdir -p Formula
          cp ../retake.rb Formula/retake.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/retake.rb
          if git diff --cached --quiet; then
            echo "The formula is current"
          else
            git commit -m "retake ${TAG#v}"
            git push
          fi
