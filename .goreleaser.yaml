# Release archives of the `retake` binary (Go, with the review page embedded) for Linux, macOS and Windows on amd64
# and arm64; on Linux and macOS with the tools that ship with it (herdr, ffmpeg, retake-edit; scripts/bundle-deps.sh). The Rust editor, retake-edit, is built separately on native runners (cargo, one runner per platform):
# it links prebuilt Skia, which goreleaser's rust builder (cargo-zigbuild) can't cross-link for macOS or MSVC.
#
#   make snapshot                          # = goreleaser release --snapshot --clean: archives in dist/, nothing published
#   goreleaser check                       # validate this file
#
# The product name isn't final: project_name is the one place it's set here ({{ .ProjectName }} everywhere below).
# The Go module path comes from go.mod ({{ .ModulePath }}). Versions come from vX.Y.Z git tags.
#
# Publishing is OFF (release.disable below). To publish a draft GitHub release from a tag once the name and license
# are decided: set release.disable to false (keep draft: true), push a vX.Y.Z tag, and run
# `goreleaser release --clean` with GITHUB_TOKEN set.
version: 2

project_name: retake

before:
  hooks:
    # The page is compiled into the binary (-tags webdist embeds web/dist).
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: retake
    main: ./cmd/retake
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    tags: [webdist]
    flags: [-trimpath]
    ldflags:
      - -s -w -X {{ .ModulePath }}/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: file times come from the commit

archives:
  - id: retake
    ids: [retake]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Neutral owners in the archive, not the build machine's user.
    builds_info: { owner: root, group: root, mode: 0755 }
    files:
      # Globs, not names: a glob that matches nothing is skipped, a missing name fails the build.
      - src: README*
        info: &docinfo { owner: root, group: root, mode: 0644 }
      - src: CHANGELOG*
        info: *docinfo
      - src: THIRD_PARTY_NOTICES*
        info: *docinfo
      - src: LICENSE* # none yet: the license isn't decided
        info: *docinfo
      # The tools that ship with retake (docs/install-plan.md), put in dist-bundle/<os>_<arch>/ by
      # scripts/bundle-deps.sh (make snapshot runs it): herdr, ffmpeg and ffprobe, retake-edit, their licenses and
      # retake-bundle.json, which makes retake put this folder first on its PATH (spec/setup.md). A platform without
      # them (Windows) gets the plain archive.
      - src: "dist-bundle/{{ .Os }}_{{ .Arch }}/bin/*"
        dst: .
        strip_parent: true
        info: { owner: root, group: root, mode: 0755 }
      - src: "dist-bundle/{{ .Os }}_{{ .Arch }}/licenses/*"
        dst: licenses
        strip_parent: true
        info: *docinfo
      - src: "dist-bundle/{{ .Os }}_{{ .Arch }}/retake-bundle*.json"
        dst: .
        strip_parent: true
        info: *docinfo

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The retake-edit archives, built on native runners, are put in dist-editor/ before goreleaser runs, so one
  # checksums.txt covers both binaries (scripts/install.sh checks against it). Nothing there: nothing added.
  extra_files:
    - glob: ./dist-editor/*

snapshot:
  # Between releases: the next patch version as a pre-release, like scripts/version.sh. The commit is "none" when the
  # checkout has no git remote (goreleaser then skips reading git state), so it's left out then.
  version_template: '{{ incpatch .Version }}-snapshot{{ if ne .ShortCommit "none" }}+g{{ .ShortCommit }}{{ end }}'

changelog:
  disable: true # CHANGELOG.md is written by hand

release:
  disable: true # see the top of this file
  draft: true
  extra_files:
    - glob: ./dist-editor/*
