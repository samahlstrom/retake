# Retake on a server: one container and one volume (SQLite and the media as files in /data).
#
#   cd deploy
#   echo RETAKE_PUBLIC_URL=https://review.example.com > .env
#   docker compose up -d
#   docker compose logs retake     # the one-time setup link: open it to create the owner account
#
# docs/hosting.md is the short story; deploy/README.md has HTTPS, transcription, mail, backups and upgrades.
#
# The "scale" profile adds Postgres (the stores) and MinIO (the media) instead of the volume's SQLite and files. Turn
# it on with COMPOSE_PROFILES=scale and the settings in deploy/README.md ("Postgres and MinIO").
#
# Settings come from the environment or a .env file next to this file (deploy/.env).

# The project name: the volumes are retake_retake-data (and retake_pg-data, retake_minio-data); the network retake_default.
name: retake

services:
  retake:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Only on this machine by default: a reverse proxy (deploy/Caddyfile) terminates TLS in front of it. Set
      # RETAKE_BIND=0.0.0.0 to reach it from other machines without one.
      - "${RETAKE_BIND:-127.0.0.1}:${RETAKE_PORT:-8080}:8080"
    environment:
      # The address people use. Sign-in links, the setup link and the connect line are made from it.
      RETAKE_PUBLIC_URL: ${RETAKE_PUBLIC_URL:-http://localhost:8080}
      # The proxy's address as the container sees it, e.g. the docker bridge (172.16.0.0/12). Only these peers'
      # X-Forwarded-* headers are believed.
      RETAKE_TRUSTED_PROXIES: ${RETAKE_TRUSTED_PROXIES:-}
      # Empty: SQLite and local files in /data. The scale profile sets both (deploy/README.md).
      RETAKE_DATABASE_URL: ${RETAKE_DATABASE_URL:-}
      RETAKE_S3_ENDPOINT: ${RETAKE_S3_ENDPOINT:-}
      RETAKE_S3_BUCKET: ${RETAKE_S3_BUCKET:-retake}
      RETAKE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-retake}
      RETAKE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-retake-minio-secret}
      RETAKE_S3_INSECURE: "1" # MinIO on the compose network, not the internet
      # Mail sign-in links instead of printing them: smtp://user:password@host:587 (STARTTLS) or smtps://...:465.
      RETAKE_SMTP_URL: ${RETAKE_SMTP_URL:-}
      RETAKE_SMTP_FROM: ${RETAKE_SMTP_FROM:-}
    volumes:
      # Everything: server.db, the projects (their stores, takes, notes and posters), uploads in progress and the
      # whisper models. With the scale profile, a cache of MinIO's media.
      - retake-data:/data
      # [transcribe] and other settings: mount a config.toml.
      # - ./config.toml:/config/retake/config.toml:ro
    depends_on:
      # Only with the scale profile; without it these services don't exist and nothing waits.
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    profiles: [scale]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retake
      POSTGRES_DB: retake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retake}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "retake", "-d", "retake"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  minio:
    profiles: [scale]
    # Upstream stopped publishing minio/minio images in 2025. pgsty/minio is a drop-in community build of the same
    # server (with mc and curl). Point MINIO_IMAGE at another build, or use any S3-compatible store instead.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Change both. retake uses them as its S3 keys (above).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-retake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-retake-minio-secret}
    volumes:
      - minio-data:/data
    # No published ports: only retake talks to it, over the compose network.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  retake-data:
  pg-data:
  minio-data:
