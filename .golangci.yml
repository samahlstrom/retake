version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout follows the JSON field order, on purpose
        - shadow # `err` shadowing in small scopes is idiomatic here
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    # npm packages can ship Go files (flatted does); they aren't ours.
    paths:
      - node_modules
    presets:
      - std-error-handling
    rules:
      # Tests build fixtures with fixed permissions, fetch their own httptest URLs and run ffmpeg: gosec is noise there.
      - path: _test\.go|internal/testmedia/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - node_modules
  settings:
    goimports:
      local-prefixes:
        - github.com/samahlstrom/retake
